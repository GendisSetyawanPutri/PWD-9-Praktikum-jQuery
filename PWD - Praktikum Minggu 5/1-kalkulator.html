<!DOCTYPE html>
<html>
<head>
    <title>Kalkulator Sederhana</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 400px; margin: 50px auto; 
            padding: 20px; 
            background-image: url("kalkulator.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .kalkulator { 
            background: #b9c9e7; 
            padding: 30px; border-radius: 10px; 
            box-shadow: 0 5px 15px #ffffff; 
            text-align: center; 
            font-size: 18px; 
            font-weight: bold; 
            color: #991e5a;
        }
        input { 
            padding: 10px; 
            margin: 5px; 
            font-size: 16px; 
            width: 80%; 
            box-sizing: border-box; 
        }
        button { 
            padding: 10px 15px; 
            margin: 5px; 
            font-size: 16px; 
            background: #dbe586; 
            color: #991e5a; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
        }
        button:hover { 
            background: #db1374;
        }
        .hasil { 
            font-size: 28px; 
            font-weight: bold; 
            color: #991e5a; 
            margin-top: 20px; 
        }
    </style>
</head>
<body>
    <div class="kalkulator">
        <h2>🧮 Kalkulator</h2>

        <input type="number" id="angka1" placeholder="Masukkan Angka Pertama">
        <br>
        <input type="number" id="angka2" placeholder="Masukkan Angka Kedua">
        <br><br>

        <button onclick="tambah()">+</button>
        <button onclick="kurang()">−</button>
        <button onclick="kali()">×</button>
        <button onclick="bagi()">÷</button>

        <br>

        <button onclick="reset()" style="background:#efc0da;">
            Reset
        </button>

        <div class="hasil">
            Hasil: <span id="hasilAngka">0</span>
        </div>
    </div>

    <script>
        // Penjelasan: document.getElementById digunakan untuk mengambil nilai
        // dari tag HTML

        function tambah() {
            let a = parseFloat(document.getElementById('angka1').value);
            let b = parseFloat(document.getElementById('angka2').value);
            document.getElementById('hasilAngka').innerHTML = a + b;
        }

        function kurang() {
            let a = parseFloat(document.getElementById('angka1').value);
            let b = parseFloat(document.getElementById('angka2').value);
            document.getElementById('hasilAngka').innerHTML = a - b;
        }

        function kali() {
            let a = parseFloat(document.getElementById('angka1').value);
            let b = parseFloat(document.getElementById('angka2').value);
            document.getElementById('hasilAngka').innerHTML = a * b;
        }

        function bagi() {
            let a = parseFloat(document.getElementById('angka1').value);
            let b = parseFloat(document.getElementById('angka2').value);

            // Validasi pencegahan pembagian dengan angka 0
            if (b === 0) {
                alert('Peringatan: Tidak bisa membagi dengan angka 0!');
                return;
            }
            document.getElementById('hasilAngka').innerHTML = a / b;
        }

        function reset() {
            document.getElementById('angka1').value = '';
            document.getElementById('angka2').value = '';
            document.getElementById('hasilAngka').innerHTML = '0';
        }
    </script>
</body>
</html>
